plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}
apply plugin: 'org.jreleaser'

version "1.0.0"

android {
    namespace "org.dashj.scrypt"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "$version"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    ndkVersion '29.0.14206865'

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {

}

task comps {
    afterEvaluate {
        println("Components: " + components*.name)
    }
}

afterEvaluate {
    def projectVersion = version
    
    publishing {
        publications {
            release(MavenPublication) {
                groupId group
                artifactId = 'dashj-scrypt-android'
                version projectVersion
                from components.release

                pom {
                    name = 'DashJ Scrypt'
                    description = 'DashJ Scrypt Libary for Android'
                    url = 'https://github.com/dashpay/dashj-android'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'hashengineering'
                            name = 'HashEngineering'
                            email = 'hashengineeringsolutions@gmail.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/dashpay/dashj-android.git'
                        developerConnection = 'scm:git:ssh://github.com/dashpay/dashj-android.git'
                        url = 'http://github.com/dashpay/dashj-android.git'
                    }
                }
            }
        }
        repositories {
            maven {
                url = layout.buildDirectory.dir('staging-deploy')
            }
        }
    }
    jreleaser {
        project {
            name = 'dashj-scrypt-android'
            description = 'DashJ Scrypt Libary for Android'
            website = 'https://github.com/dashpay/dashj-android'
            authors = ['HashEngineering']
            license = 'The Apache License, Version 2.0'
            gitRootSearch = true
            version = projectVersion
        }

        signing {
            active = 'ALWAYS'
            armored = true
        }

        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'ALWAYS'
                        url = 'https://central.sonatype.com/api/v1/publisher'
                        stagingRepository("$buildDir/staging-deploy")
                        verifyPom = false
                    }
                }
                nexus2 {
                    app {
                        active = 'SNAPSHOT'
                        url = 'https://central.sonatype.com/repository/maven-snapshots/'
                        snapshotUrl = 'https://central.sonatype.com/repository/maven-snapshots/'
                        applyMavenCentralRules = false // must be false for aar
                        snapshotSupported = true
                        closeRepository = true
                        releaseRepository = true
                        stagingRepository("$buildDir/staging-deploy")
                        verifyPom = false
                    }
                }
            }
        }
    }
    signing {
        required { gradle.taskGraph.hasTask("publish") }
        sign publishing.publications.release
    }
}

